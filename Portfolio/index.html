    <script>
      /* Set the theme before first paint so there is no flash of the wrong colours. */
      (function () {
        var t;
        try {
          t = localStorage.getItem('fn-theme');
        } catch (e) {}
        // Dark is the site default; the OS preference no longer decides.
        if (t !== 'light' && t !== 'dark') {
          t = 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);

        var p;
        try {
          p = localStorage.getItem('fn-palette');
        } catch (e) {}
        var known = ['midnight', 'emerald', 'amber', 'crimson', 'navy', 'violet', 'forest', 'steel', 'teal', 'copper'];
        document.documentElement.setAttribute('data-palette', known.indexOf(p) > -1 ? p : 'midnight');
      })();
    </script>
